spring.application.name=DESIGN_BOOK_MY_SHOW
server.port=8081

# FIXED: Changed protocol to postgresql and port to 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/book_my_show
spring.datasource.username=postgres
spring.datasource.password=sasic
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


############################
jwt.secret=MyVeryStrongSecretKeyForJWT123456


# REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379

# KAFKA
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=bookmyshow-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.scaler.dbmshow.dtos.PaymentSuccessEvent